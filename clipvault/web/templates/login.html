{% extends "bare.html" %}
{% block title %}Log in · ClipVault{% endblock %}
{% block content %}
<div class="intro">
  <div class="brand" style="padding: 0">ClipVault</div>
  <h1>Log in</h1>
  <p class="lead">Enter the control panel password.</p>
</div>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="field"><span>Password</span><input type="password" name="password" required autocomplete="current-password" autofocus></label>
  <div class="nav-row"><span class="muted small">Forgot it? On the ClipVault computer run <code>python -m clipvault panel reset-password</code>.</span><button class="btn large primary">Log In</button></div>
</form>
{% endblock %}
