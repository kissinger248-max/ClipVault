{% extends "base.html" %}
{% block nav %}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Password <input type="password" name="password" required autocomplete="current-password" autofocus></label>
    <button class="primary">Log in</button>
  </form>
  <p class="muted">Forgot it? On the ClipVault computer run <code>python -m clipvault panel reset-password</code>.</p>
</section>
{% endblock %}
