<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6441a5">
<title>{% block title %}ClipVault{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css?v={{ version }}">
<script src="/static/app.js?v={{ version }}" defer></script>
</head>
<body class="{% block bodyclass %}{% endblock %}">
<header class="top">
  <a class="brand" href="/">ClipVault</a>
  {% block top %}{% endblock %}
</header>
{% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}
<main>{% block content %}{% endblock %}</main>
{% block nav %}
<nav class="tabs" aria-label="Main">
  <a href="/" class="{{ 'on' if tab == 'home' }}"><span aria-hidden="true">⌂</span>Home</a>
  <a href="/clips" class="{{ 'on' if tab == 'clips' }}"><span aria-hidden="true">▶</span>Clips</a>
  <a href="/streamers" class="{{ 'on' if tab == 'streamers' }}"><span aria-hidden="true">☺</span>Streamers</a>
  <a href="/settings" class="{{ 'on' if tab == 'settings' }}"><span aria-hidden="true">⚙</span>Settings</a>
</nav>
{% endblock %}
</body>
</html>
