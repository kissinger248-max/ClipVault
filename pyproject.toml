[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipvault"
version = "0.6.0"
description = "Watches Twitch streamers, saves their best clips, and posts vertical versions for permissioned streamers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "keyring>=25",
    "httpx>=0.27",
    "tenacity>=8.2",
    "yt-dlp",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "APScheduler>=3.10,<4",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
    "qrcode>=7.4",
    "websockets>=13",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Heavier extras, installed when their milestone arrives.
render = ["opencv-python-headless>=4.9", "numpy", "pillow>=10.1"]
transcribe = ["faster-whisper>=1.0"]
desktop = ["pystray>=0.19", "pillow", "tzlocal>=5", "pywebview>=5.3"]
# Everything the installed app bundles, plus the builder (packaging/build.py).
app = ["clipvault[render,transcribe,desktop]"]
build = ["clipvault[app]", "pyinstaller>=6.10"]

[project.scripts]
clipvault = "clipvault.__main__:main"

[tool.setuptools.packages.find]
include = ["clipvault*"]

[tool.setuptools.package-data]
"clipvault.migrations" = ["*.sql"]
"clipvault.data" = ["*.txt", "*.yaml", "*.onnx", "emoji/*"]
"clipvault.web" = ["templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["clipvault-brief"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
