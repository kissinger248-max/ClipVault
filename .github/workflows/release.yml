# Builds the installed app on GitHub's Windows and Mac machines, tests each build,
# and (for a version tag like v0.2.0) publishes them as a GitHub release.
#
# - Push a tag "vX.Y.Z"  -> build, test, release with both installers attached.
# - Run it by hand (Actions tab, "Run workflow") -> build and test only; the
#   installers are kept as downloadable artifacts for a week.
#
# The download page links to releases/latest/download/<file>, which always
# points at the newest release.

name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            file: packaging/build/ClipVault-Setup-Windows.exe
          - name: macOS
            os: macos-latest   # Apple silicon
            file: packaging/build/ClipVault-macOS.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ClipVault and the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # macOS: sign with ClipVault's own fixed identity so every version is the same
      # program to the keychain (no "ClipVault wants to use your confidential
      # information" after each update). Releases need the real one (repository secret
      # MAC_SIGN_P12, base64 .p12, + MAC_SIGN_PASSWORD); test builds without it make a
      # throwaway identity, which tests the mechanism but must never ship.
      - name: Signing identity (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          NAME="ClipVault Code Signing"
          P12="$RUNNER_TEMP/sign.p12"
          KC="$RUNNER_TEMP/clipvault-signing.keychain-db"
          KCPW="$(uuidgen)"
          if [ -n "${MAC_SIGN_P12:-}" ]; then
            echo "$MAC_SIGN_P12" | base64 --decode > "$P12"
            PW="$MAC_SIGN_PASSWORD"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::MAC_SIGN_P12 is missing: releases must be signed with ClipVault's own identity"
            exit 1
          else
            echo "::warning::No MAC_SIGN_P12 secret: throwaway identity for this test build"
            PW="test-only"
            openssl req -x509 -newkey rsa:2048 -sha256 -days 30 -nodes \
              -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -subj "/CN=$NAME" \
              -addext "basicConstraints=critical,CA:false" -addext "keyUsage=critical,digitalSignature" \
              -addext "extendedKeyUsage=critical,codeSigning"
            openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
              -name "$NAME" -out "$P12" -passout "pass:$PW" \
              -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
            rm -f "$RUNNER_TEMP/key.pem"
          fi
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$P12" -k "$KC" -P "$PW" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          HASH="$(security find-certificate -c "$NAME" -Z "$KC" | awk '/SHA-1 hash/ {print $NF}')"
          test -n "$HASH"
          echo "CLIPVAULT_MAC_SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          security find-identity -p codesigning "$KC" || true

      - name: Build, selftest, smoke test and installer
        run: python packaging/build.py --smoke

      - name: Open the Mac app like a person does (start, open again while running)
        if: runner.os == 'macOS'
        run: python packaging/mac_open_check.py packaging/build/dist/ClipVault.app

      - name: Oldest macOS the app runs on (for the download page)
        if: runner.os == 'macOS'
        run: |
          find packaging/build/dist/ClipVault.app -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 -n1 vtool -show-build 2>/dev/null | awk '/minos/ {print $2}' | sort -V | tail -1 \
            | tee packaging/build/macos-minimum.txt
          lipo -archs packaging/build/dist/ClipVault.app/Contents/MacOS/ClipVault | tee packaging/build/macos-archs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ClipVault-${{ matrix.name }}
          path: ${{ matrix.file }}
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos-build-facts
          path: packaging/build/macos-*.txt
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          sha256sum ClipVault-Setup-Windows.exe ClipVault-macOS.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" ClipVault-Setup-Windows.exe ClipVault-macOS.dmg SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ClipVault ${GITHUB_REF_NAME}" \
            --notes "Download for Windows: ClipVault-Setup-Windows.exe. Download for Mac (Apple silicon): ClipVault-macOS.dmg. First time? See the download page for the two-minute setup."
