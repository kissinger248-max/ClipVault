# Builds the installed app on GitHub's Windows and Mac machines, tests each build,
# and (for a version tag like v0.2.0) publishes them as a GitHub release.
#
# - Push a tag "vX.Y.Z"  -> build, test, release with both installers attached.
# - Run it by hand (Actions tab, "Run workflow") -> build and test only; the
#   installers are kept as downloadable artifacts for a week.
#
# The download page links to releases/latest/download/<file>, which always
# points at the newest release.

name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            file: packaging/build/ClipVault-Setup-Windows.exe
          - name: macOS
            os: macos-14   # Apple silicon
            file: packaging/build/ClipVault-macOS.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ClipVault and the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build, selftest, smoke test and installer
        run: python packaging/build.py --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: ClipVault-${{ matrix.name }}
          path: ${{ matrix.file }}
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ClipVault ${GITHUB_REF_NAME}" \
            --notes "Download for Windows: ClipVault-Setup-Windows.exe. Download for Mac (Apple silicon): ClipVault-macOS.dmg. First time? See the download page for the two-minute setup."
