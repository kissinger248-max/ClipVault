<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClipVault: FAQ</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@500;600;700;800&amp;family=Instrument+Serif:ital@1&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="cv-site" data-theme="{{theme}}" style="min-height: 2300px; font-size: 17px; line-height: 1.5">

<header class="cv-nav" style="position: sticky; top: 0; z-index: 10; background: var(--nav); border-bottom: 1px solid var(--sep)">
  <nav aria-label="Main" style="max-width: 1160px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; color: var(--label); font-weight: 700; font-size: 18px; text-decoration: none; margin-right: auto"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 9.2l4.2 2.8-4.2 2.8z" fill="#FFFFFF"/></svg></span>ClipVault</a>
    <a href="Main.dc.html#features" style="color: var(--label); font-size: 15px">Features</a>
    <a href="FAQ.dc.html" aria-current="page" style="color: var(--label); font-size: 15px; font-weight: 600">FAQ</a>
    <a href="About.dc.html" style="color: var(--label); font-size: 15px">About</a>
    <a class="cv-btn" href="Main.dc.html#download" style="display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 18px; background: var(--accent); color: #FFFFFF; font-size: 15px; font-weight: 600">Download</a>
  </nav>
</header>

<main style="max-width: 820px; margin: 0 auto; padding: 72px 24px 96px; display: flex; flex-direction: column; gap: 40px">
  <div class="cv-rise" style="display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-size: 76px; line-height: 0.95; font-weight: 600; letter-spacing: -0.05em">Questions <em style="font-size: 82px">&amp; answers.</em></h1>
    <p style="margin: 0; font-size: 19px; color: var(--label2)">Can’t find what you need? Write to <a href="mailto:[CONTACT EMAIL]">[CONTACT EMAIL]</a>.</p>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
    <section aria-label="{{g.title}}" class="cv-rise r1" style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0 0 0 4px; font-size: 15px; font-weight: 700; color: var(--label2); letter-spacing: 0.02em; text-transform: uppercase">{{g.title}}</h2>
      <div style="border-radius: 20px; background: var(--card); border: 1px solid var(--sep); box-shadow: var(--shadow); overflow: hidden">
        <sc-for list="{{g.items}}" as="q" hint-placeholder-count="3">
          <details style="border-top: {{q.border}}">
            <summary style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 22px; font-weight: 600">{{q.q}}<svg class="cv-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--label2)" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"/></svg></summary>
            <div style="padding: 0 22px 20px; color: var(--label2); white-space: pre-line">{{q.a}}</div>
          </details>
        </sc-for>
      </div>
    </section>
  </sc-for>
</main>

<footer style="border-top: 1px solid var(--sep); background: var(--bg2)">
  <div style="max-width: 1160px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; font-size: 14px; color: var(--label2)">
    <span style="margin-right: auto">© 2026 [YOUR NAME]. Not affiliated with Twitch, TikTok, YouTube or Google.</span>
    <a href="Privacy.dc.html">Privacy</a><a href="Terms.dc.html">Terms</a><a href="Licenses.dc.html">Licences</a><a href="mailto:[CONTACT EMAIL]">Contact</a>
  </div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"appearance":{"editor":"enum","options":["System","Light","Dark"],"default":"System"},"$preview":{"width":1280,"height":2300}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { title: 'Getting started', items: [
        ['What does ClipVault do?', 'It watches the Twitch streamers you choose and saves their best moments to a folder on your computer: the clips viewers made, plus moments nobody clipped that it finds from chat. It also makes a vertical, phone-ready version of each one with a headline and captions.'],
        ['Is ClipVault free?', '[YOUR ANSWER, for example: Yes. ClipVault is free to download and use.]'],
        ['Which computers does it run on?', 'Mac, Windows and Linux. There’s also a Docker image for an always-on server. Once it’s running, you can open its control panel on your phone over the same Wi-Fi.'],
        ['Do I need a Twitch account?', 'Yes, to get the free app keys from the Twitch developer console. Setup shows you where to click. Logging in to Twitch inside ClipVault is optional; it’s only needed to catch moments while a stream is live, and it can only read chat, never write.'],
        ['What else do I need to install?', 'FFmpeg, a free video tool. ClipVault’s built-in checkup tells you if it’s missing and how to get it. For moments found in chat after a stream ends, you also need the free TwitchDownloaderCLI.']
      ]},
      { title: 'Everyday use', items: [
        ['Do I have to keep ClipVault open?', 'It needs to be running to find new clips. It sits next to the clock and checks every 30 minutes. If your laptop sleeps or is switched off, it catches up when it’s back.'],
        ['Will it drain my laptop battery?', 'On battery it keeps downloading, but waits for the charger before heavier work like subtitles and phone versions. You can change this in Settings.'],
        ['How much disk space does it use?', 'Roughly 10 GB a month for each streamer, mostly phone versions. Clips older than 60 days with fewer views than usual are cleaned up automatically. Starred clips and anything in the Favorites folder are always kept. Downloads pause if your disk gets low.'],
        ['Can I keep my library on an external drive?', 'Yes. Choose the folder in Settings. If the drive is unplugged, new clips wait on your computer and move over when it’s back.'],
        ['How do I get notifications on my phone?', 'Install the free ntfy app and scan the code shown in setup or Settings. You’ll get one summary each morning, plus a message only when something needs you. Quiet hours hold messages overnight.']
      ]},
      { title: 'Your clips and the rules', items: [
        ['Does ClipVault post to TikTok or YouTube?', 'No. It saves clips and phone-ready versions to your computer and doesn’t upload or post anything.'],
        ['Can I share or repost the clips I save?', 'The clips belong to the streamers who made them, and the music or game footage in them may belong to others. ClipVault is for your own archive. Before you share a clip anywhere, get the streamer’s permission and follow the rules of the site you post on. This isn’t legal advice.'],
        ['Is this allowed by Twitch?', 'ClipVault finds clips through Twitch’s official API. Some features use other open-source tools to fetch video and chat. You’re responsible for using it in line with Twitch’s Terms of Service and the law where you live.'],
        ['Some saved clips have no sound. Why?', 'Twitch mutes copyrighted music in stream recordings. ClipVault keeps those moments and marks them as muted.']
      ]},
      { title: 'Privacy and security', items: [
        ['Does ClipVault send my data anywhere?', 'Your clips and library stay on your computer. ClipVault talks to Twitch to find and fetch clips. Optional features send data only to the services you set up: transcription and AI headlines (if you add those keys) and ntfy (if you turn on phone notifications). The Privacy page lists each one.'],
        ['Where are my keys stored?', 'In your operating system’s keychain, not in a file. They’re never shown again after you save them.'],
        ['Who can open the control panel?', 'By default only your computer. If you allow phones on your Wi-Fi, the panel is still protected by the password you chose.']
      ]},
      { title: 'Troubleshooting', items: [
        ['My computer warns me when I open the installer.', '[ADJUST TO YOUR SIGNING STATUS. If builds are signed: the download is signed by YOUR NAME. If not: unsigned apps show a warning; how to open it anyway on macOS and Windows, and how to check the SHA-256 checksum first.]'],
        ['Downloads stopped working.', 'Twitch changes things now and then. The download tool updates itself once a day, so this usually fixes itself. If it doesn’t, the Home screen shows a Fix button.'],
        ['How do I update ClipVault?', '[YOUR ANSWER, for example: Download the newest version from this page and install it over the old one. Your library and settings are kept.]'],
        ['How do I uninstall it and remove my data?', 'Uninstall the app as usual. Your clips stay in your library folder until you delete them. To remove everything, also delete the ClipVault folder that holds its database and logs, and remove its keys from your system keychain.'],
        ['Where can I report a bug?', 'Write to [CONTACT EMAIL] or open an issue at [ISSUE TRACKER URL]. Attaching the day’s log file from the logs folder helps.']
      ]}
    ];
    const groups = raw.map((g) => ({ title: g.title, items: g.items.map((it, i) => ({ q: it[0], a: it[1], border: i === 0 ? '0' : '1px solid var(--sep)' })) }));
    return { theme: (this.props.appearance || 'System').toLowerCase(), groups };
  }
}
</script>
</body>
</html>
