<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClipVault Clips on phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./motion.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Segoe UI', sans-serif; font-size: 17px; line-height: 22px">
  <div style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 60px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700">Clips</h1>
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; background: {{t.fill}}; color: {{t.label2}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search by what was said</span>
      <input type="search" placeholder="Search by what was said" style="border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font: inherit; color: {{t.label}}">
    </label>
    <div role="group" aria-label="Filters" style="display: flex; gap: 8px; overflow-x: auto; margin-right: -16px">
      <button type="button" aria-pressed="true" style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: {{t.label}}; font: inherit; font-size: 15px; font-weight: 600; color: {{t.bg}}; cursor: pointer">All</button>
      <button type="button" aria-pressed="false" style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: {{t.card}}; font: inherit; font-size: 15px; color: {{t.label}}; cursor: pointer">Viewer clips</button>
      <button type="button" aria-pressed="false" style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: {{t.card}}; font: inherit; font-size: 15px; color: {{t.label}}; cursor: pointer">Chat and live</button>
      <button type="button" aria-pressed="false" style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: {{t.card}}; font: inherit; font-size: 15px; color: {{t.label}}; cursor: pointer">Starred</button>
      <button type="button" style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: {{t.card}}; font: inherit; font-size: 15px; color: {{t.label}}; cursor: pointer">More Filters</button>
    </div>
    <div style="font-size: 13px; line-height: 18px; color: {{t.label2}}">4 more clips are still being edited.</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 10px">
      <sc-for list="{{clips}}" as="c" hint-placeholder-count="4">
        <a href="ClipPage.dc.html" style="display: flex; flex-direction: column; gap: 6px; color: {{t.label}}; text-decoration: none">
          <div class="cv-thumb" style="aspect-ratio: 9 / 16; border-radius: 14px; background: #0E0E10; position: relative; overflow: hidden">
            <div style="position: absolute; left: 0; right: 0; top: 36%; height: 30%; background: {{c.tone}}"></div>
            <div style="position: absolute; left: 10%; right: 10%; top: 13%; padding: 4px 5px; border-radius: 6px; background: #FFFFFF; color: #111111; font-family: Montserrat, Inter, sans-serif; font-weight: 800; font-size: 12px; line-height: 14px; text-align: center; text-transform: uppercase">{{c.head}} <span style="color: #D9480F">{{c.key}}</span></div>
            <sc-if value="{{c.kind}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 6px; bottom: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,0.65); color: #FFFFFF; font-size: 11px; font-weight: 600">{{c.kind}}</span></sc-if>
            <span style="position: absolute; right: 6px; bottom: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,0.65); color: #FFFFFF; font-size: 11px; font-weight: 600">{{c.len}}</span>
          </div>
          <div><div style="font-size: 15px; line-height: 20px; font-weight: 600">{{c.who}}</div><div style="font-size: 13px; line-height: 18px; color: {{t.label2}}">{{c.meta}}</div></div>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Sections" style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 62px; border-radius: 31px; background: {{t.glass}}; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid {{t.glassEdge}}; box-shadow: 0 6px 24px rgba(0,0,0,0.14); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 4px; box-sizing: border-box">
    <a href="PhoneHome.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{t.label}}; font-size: 11px; line-height: 13px; font-weight: 500; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home<span aria-label="1 problem" style="position: absolute; top: 4px; right: 18px; min-width: 18px; height: 18px; border-radius: 9px; background: {{t.badge}}; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span></a>
    <a href="PhoneClips.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; background: {{t.fill}}; color: {{t.link}}; font-size: 11px; line-height: 13px; font-weight: 600; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8.5 2h7A2.5 2.5 0 0 1 18 4.5v15a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 6 19.5v-15A2.5 2.5 0 0 1 8.5 2zm2 7.5v5l4-2.5z"/></svg>Clips</a>
    <a href="Streamers.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{t.label}}; font-size: 11px; line-height: 13px; font-weight: 500; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M1.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5z"/><path d="M16 4a4 4 0 0 1 0 8zM17.5 14.6c2.6.8 4.4 3.1 5 6.4h-4.6c-.2-2.5-1.1-4.6-2.6-6.1z"/></svg>Streamers</a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{t.label}}; font-size: 11px; line-height: 13px; font-weight: 500; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2" fill="currentColor"/><circle cx="10" cy="12" r="2" fill="currentColor"/><circle cx="18" cy="18" r="2" fill="currentColor"/></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = {bg:'#F2F2F7',card:'#FFFFFF',label:'#1D1D1F',label2:'#6E6E73',fill:'#E3E3E8',link:'#1E6EF4',badge:'#C50F25',glass:'rgba(255,255,255,0.75)',glassEdge:'rgba(255,255,255,0.9)'};
const D = {bg:'#000000',card:'#1C1C1E',label:'#F5F5F7',label2:'#A1A1A6',fill:'#2C2C2E',link:'#5CB8FF',badge:'#E5323F',glass:'rgba(44,44,46,0.75)',glassEdge:'rgba(255,255,255,0.12)'};
const clips = [
 {head:'This ending was', key:'unreal', who:'Valkyrae', meta:'48.1K views · 2 h ago', len:'0:34', tone:'#1E2633', kind:''},
 {head:'Chat could not', key:'believe it', who:'Kai Cenat', meta:'Live chat · 25 min ago', len:'0:40', tone:'#2B1E2E', kind:'Live moment'},
 {head:'Nobody saw that', key:'coming', who:'xQc', meta:'31.7K views · 4 h ago', len:'0:22', tone:'#1F2B24', kind:''},
 {head:'Wait for the', key:'last second', who:'Valkyrae', meta:'From chat · 6 h ago', len:'0:40', tone:'#2E2A1E', kind:'Chat moment'}
];
return { t: this.props.dark ? D : L, clips };
}
}
</script>
</body>
</html>
