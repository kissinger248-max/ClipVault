<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClipVault Streamers</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./motion.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 900px; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Segoe UI', sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-wrap: wrap">

<nav aria-label="Sections" style="flex: 1 1 200px; max-width: 100%; box-sizing: border-box; background: {{t.side}}; border-right: 1px solid {{t.sep}}; padding: 20px 12px; display: flex; flex-direction: column; gap: 16px">
  <div style="padding: 0 10px; font-size: 17px; line-height: 22px; font-weight: 700">ClipVault</div>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: {{t.label}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.link}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span style="flex: 1">Home</span><span aria-label="1 problem" style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: {{t.badge}}; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span></a>
    <a href="Clips.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: {{t.label}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.link}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 9.5l4 2.5-4 2.5z"/></svg>Clips</a>
    <a href="Streamers.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; background: {{t.sel}}; color: {{t.label}}; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.link}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>Streamers</a>
    <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: {{t.label}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.link}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</a>
  </div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 20px">
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
    <div><h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700">Streamers</h1><div style="color: {{t.label2}}; font-size: 13px">3 streamers · about 30 GB of new clips a month</div></div>
    <form style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
      <label for="add" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Twitch name or channel link</label>
      <input id="add" type="text" placeholder="Twitch name or channel link" style="height: 36px; width: 280px; max-width: 100%; box-sizing: border-box; padding: 0 12px; border-radius: 9px; border: 1px solid {{t.sep}}; background: {{t.card}}; font: inherit; color: {{t.label}}">
      <button type="button" style="height: 36px; padding: 0 16px; border-radius: 9px; border: 0; background: {{t.accent}}; font: inherit; color: #FFFFFF; font-weight: 600; cursor: pointer">Add</button>
    </form>
  </header>

  <div style="display: flex; flex-direction: column; gap: 12px; max-width: 900px">
    <sc-for list="{{rows}}" as="s" hint-placeholder-count="3">
      <section aria-label="{{s.name}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; padding: 16px 18px; border-radius: 14px; background: {{t.card}}; border: 1px solid {{t.sep}}; box-shadow: {{t.shadow}}">
        <div style="flex: 1 1 220px; display: flex; align-items: center; gap: 12px">
          <div aria-hidden="true" style="flex: none; width: 48px; height: 48px; border-radius: 24px; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">{{s.initial}}</div>
          <div>
            <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 17px; line-height: 22px; font-weight: 600">{{s.name}}</span><sc-if value="{{s.live}}" hint-placeholder-val="{{ false }}"><span class="cv-live" style="padding: 1px 7px; border-radius: 5px; background: #E5133A; color: #FFFFFF; font-size: 11px; font-weight: 800; letter-spacing: 0.04em">LIVE</span></sc-if></div>
            <div style="color: {{t.label2}}; font-size: 13px">{{s.saved}}</div>
          </div>
        </div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: {{t.label2}}">Keep
          <select style="height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid {{t.sep}}; background: {{t.card}}; font: inherit; font-size: 14px; color: {{t.label}}"><option>Best 5 clips each day</option><option>Every clip with 1,000+ views</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: {{t.label2}}">Chat moments per stream
          <select style="height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid {{t.sep}}; background: {{t.card}}; font: inherit; font-size: 14px; color: {{t.label}}"><option>3</option></select></label>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="font-size: 13px">Save clips</span>
          <button type="button" role="switch" aria-checked="{{s.on}}" aria-label="Save clips for {{s.name}}" style="width: 44px; height: 26px; border-radius: 13px; border: 0; padding: 2px; background: {{s.swBg}}; display: flex; justify-content: {{s.swJustify}}; cursor: pointer"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></button>
        </div>
        <button type="button" style="height: 32px; padding: 0 10px; border-radius: 8px; border: 0; background: transparent; font: inherit; color: {{t.red}}; cursor: pointer">Remove</button>
      </section>
    </sc-for>
  </div>

  <p style="margin: 0; max-width: 720px; color: {{t.label2}}; font-size: 13px">Removing a streamer stops new clips and keeps the ones already saved. Turning off Save clips does the same, and you can turn it back on later.</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const dark = !!this.props.dark;
const L = {bg:'#F5F5F7',side:'#ECECF0',card:'#FFFFFF',shadow:'0 1px 2px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.04)',label:'#1D1D1F',label2:'#6E6E73',sep:'#D9D9DE',fill:'#D1D1D6',on:'#00782C',accent:'#1E6EF4',link:'#1E6EF4',red:'#C50F25',badge:'#C50F25',sel:'#DCE8FD'};
const D = {bg:'#1C1C1E',side:'#252527',card:'#2C2C2E',shadow:'inset 0 1px 0 rgba(255,255,255,0.05)',label:'#F5F5F7',label2:'#A1A1A6',sep:'#3A3A3C',fill:'#48484A',on:'#30A14E',accent:'#1E6EF4',link:'#5CB8FF',red:'#FF6165',badge:'#E5323F',sel:'#1D3557'};
const t = dark ? D : L;
const mk = (name, initial, saved, live, on, bg, fg) => ({ name, initial, saved, live, on: on ? 'true' : 'false', swBg: on ? t.on : t.fill, swJustify: on ? 'flex-end' : 'flex-start', bg, fg });
const rows = [
  mk('Kai Cenat', 'K', '214 clips saved · 38 GB', true, true, dark ? '#1D3557' : '#DCE8FD', dark ? '#9CC5FF' : '#1A4FB0'),
  mk('Valkyrae', 'V', '187 clips saved · 33 GB', false, true, dark ? '#173B22' : '#E3F4E8', dark ? '#7FE39A' : '#00602A'),
  mk('xQc', 'X', '96 clips saved · 17 GB · last download failed', false, true, dark ? '#3B1F45' : '#F3E3F7', dark ? '#E3A6F5' : '#7A2290')
];
return { t, rows };
}
}
</script>
</body>
</html>
