<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClipVault Clips</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./motion.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 1060px; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Segoe UI', sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-wrap: wrap">

<nav aria-label="Sections" style="flex: 1 1 200px; max-width: 100%; box-sizing: border-box; background: {{t.side}}; border-right: 1px solid {{t.sep}}; padding: 20px 12px; display: flex; flex-direction: column; gap: 16px">
  <div style="padding: 0 10px; font-size: 17px; line-height: 22px; font-weight: 700">ClipVault</div>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: {{t.label}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.link}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span style="flex: 1">Home</span><span aria-label="1 problem" style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: {{t.red}}; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span></a>
    <a href="Clips.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; background: {{t.sel}}; color: {{t.label}}; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.link}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 9.5l4 2.5-4 2.5z"/></svg>Clips</a>
    <a href="Streamers.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: {{t.label}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.link}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>Streamers</a>
    <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: {{t.label}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.link}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</a>
  </div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 16px">
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
    <h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700">Clips</h1>
    <label style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; width: 340px; max-width: 100%; box-sizing: border-box; border-radius: 9px; background: {{t.fill}}; color: {{t.label2}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search by what was said</span>
      <input type="search" placeholder="Search by what was said" style="border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font: inherit; color: {{t.label}}">
    </label>
  </header>

  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
    <div role="radiogroup" aria-label="Kind" style="display: inline-flex; padding: 2px; border-radius: 9px; background: {{t.fill}}; gap: 2px">
      <button type="button" role="radio" aria-checked="true" style="height: 30px; padding: 0 14px; border: 0; border-radius: 7px; background: {{t.card}}; font: inherit; font-weight: 600; color: {{t.label}}; box-shadow: 0 1px 2px rgba(0,0,0,0.12); cursor: pointer">All</button>
      <button type="button" role="radio" aria-checked="false" style="height: 30px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; font: inherit; color: {{t.label}}; cursor: pointer">Viewer clips</button>
      <button type="button" role="radio" aria-checked="false" style="height: 30px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; font: inherit; color: {{t.label}}; cursor: pointer">Chat and live moments</button>
    </div>
    <select aria-label="Streamer" style="height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid {{t.sep}}; background: {{t.card}}; font: inherit; color: {{t.label}}"><option>All streamers</option></select>
    <select aria-label="Order" style="height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid {{t.sep}}; background: {{t.card}}; font: inherit; color: {{t.label}}"><option>Newest first</option></select>
    <select aria-label="Minimum views" style="height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid {{t.sep}}; background: {{t.card}}; font: inherit; color: {{t.label}}"><option>Any number of views</option></select>
    <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid {{t.sep}}; background: {{t.card}}; font: inherit; color: {{t.label}}; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>Starred only</button>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; color: {{t.label2}}; font-size: 13px">
    <span class="cv-spin" aria-hidden="true" style="width: 14px; height: 14px; border-radius: 7px; border: 2px solid {{t.sep}}; border-top-color: {{t.link}}; box-sizing: border-box"></span>
    4 more clips are still being edited and will appear here.
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px 16px">
    <sc-for list="{{clips}}" as="c" hint-placeholder-count="10">
      <a href="ClipPage.dc.html" style="display: flex; flex-direction: column; gap: 8px; color: {{t.label}}; text-decoration: none">
        <div class="cv-thumb" style="aspect-ratio: 9 / 16; border-radius: 12px; background: #0E0E10; position: relative; overflow: hidden">
          <div style="position: absolute; left: 0; right: 0; top: 36%; height: 30%; background: {{c.tone}}"></div>
          <div style="position: absolute; left: 10%; right: 10%; top: 13%; padding: 4px 6px; border-radius: 6px; background: #FFFFFF; color: #111111; font-family: Montserrat, Inter, sans-serif; font-weight: 800; font-size: 12px; line-height: 15px; text-align: center; text-transform: uppercase">{{c.head}} <span style="color: #D9480F">{{c.key}}</span></div>
          <sc-if value="{{c.kind}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 8px; bottom: 8px; padding: 1px 6px; border-radius: 5px; background: rgba(0,0,0,0.65); color: #FFFFFF; font-size: 12px; font-weight: 600">{{c.kind}}</span></sc-if>
          <span style="position: absolute; right: 8px; bottom: 8px; padding: 1px 6px; border-radius: 5px; background: rgba(0,0,0,0.65); color: #FFFFFF; font-size: 12px; font-weight: 600">{{c.len}}</span>
          <sc-if value="{{c.star}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFD60A" stroke="#7A5A00" stroke-width="1.2" stroke-linejoin="round" role="img" aria-label="Starred" style="position: absolute; right: 8px; top: 8px"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg></sc-if>
        </div>
        <div><div style="font-weight: 600">{{c.who}}</div><div style="color: {{t.label2}}; font-size: 13px">{{c.meta}}</div></div>
      </a>
    </sc-for>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":1060}}'>
class Component extends DCLogic {
renderVals() {
const L = {bg:'#F5F5F7',side:'#ECECF0',card:'#FFFFFF',label:'#1D1D1F',label2:'#6E6E73',sep:'#D9D9DE',fill:'#E6E6EB',accent:'#1E6EF4',link:'#1E6EF4',red:'#C50F25',sel:'#DCE8FD'};
const D = {bg:'#1C1C1E',side:'#252527',card:'#2C2C2E',label:'#F5F5F7',label2:'#A1A1A6',sep:'#3A3A3C',fill:'#3A3A3C',accent:'#1E6EF4',link:'#5CB8FF',red:'#E5323F',sel:'#1D3557'};
const clips = [
 {head:'This ending was', key:'unreal', who:'Valkyrae', meta:'48.1K views · 2 h ago', len:'0:34', tone:'#1E2633', kind:'', star:true},
 {head:'Chat could not', key:'believe it', who:'Kai Cenat', meta:'From live chat · 25 min ago', len:'0:40', tone:'#2B1E2E', kind:'Live moment', star:false},
 {head:'Nobody saw that', key:'coming', who:'xQc', meta:'31.7K views · 4 h ago', len:'0:22', tone:'#1F2B24', kind:'', star:false},
 {head:'Wait for the', key:'last second', who:'Valkyrae', meta:'Found in chat · 6 h ago', len:'0:40', tone:'#2E2A1E', kind:'Chat moment', star:false},
 {head:'The clutch of the', key:'year', who:'Kai Cenat', meta:'22.4K views · 7 h ago', len:'0:51', tone:'#1E2633', kind:'', star:true},
 {head:'Watch the', key:'background', who:'xQc', meta:'12.9K views · yesterday', len:'0:29', tone:'#2B1E2E', kind:'', star:false},
 {head:'One more try', key:'then bed', who:'Valkyrae', meta:'9.8K views · yesterday', len:'0:45', tone:'#1F2B24', kind:'', star:false},
 {head:'The room went', key:'silent', who:'Kai Cenat', meta:'Found in chat · yesterday', len:'0:40', tone:'#2E2A1E', kind:'Chat moment', star:false},
 {head:'That was', key:'too close', who:'xQc', meta:'8.2K views · 2 days ago', len:'0:18', tone:'#1E2633', kind:'', star:false},
 {head:'Best reaction', key:'this week', who:'Valkyrae', meta:'7.5K views · 2 days ago', len:'0:37', tone:'#2B1E2E', kind:'', star:false}
];
return { t: this.props.dark ? D : L, clips };
}
}
</script>
</body>
</html>
