# ClipVault settings (non-secret). Copy to config.yaml and edit.
# Every key is optional; anything left out uses the default shown here.
# Secrets (Twitch keys, API keys, ntfy topic) are NOT stored here: they live in
# the OS keychain via the `keyring` library.

mode: archive            # archive | archive_post
timezone: America/Chicago
library_root: ~/Twitch Archive
quality: 720p            # 720p | 1080p
discover_interval_min: 30
heavy_jobs_on_battery: false
retention:
  keep_days_below_median: 60
  min_free_space_pct: 15
posting:
  review_mode: true
  max_per_account_per_day: 10
  spacing_min: [90, 120]
  jitter_min: 10
  active_hours: ["08:00", "23:00"]   # keep the quotes around times
look:
  template: default
  accent: "#FFD400"
  headline_style: box     # box | outline
  caption_size: 72        # 56 to 96 px
llm:                       # writes hook headlines; needs an API key: secrets set llm_api_key
  provider: groq
  model: openai/gpt-oss-20b
  base_url: https://api.groq.com/openai/v1
notifications:
  quiet_hours: ["23:00", "08:00"]    # phone notifications wait until the end of these
  summary_time: "09:00"              # daily summary
  server: https://ntfy.sh            # or your own ntfy server
panel:
  host: 127.0.0.1          # 0.0.0.0 lets other devices on your network (or Tailscale) open it
  port: 8765
transcription:
  enabled: true            # make transcripts (subtitles, search) for saved clips
  provider: auto           # auto | groq | local. auto = Groq if a key is stored, else this computer
  # language: en           # leave out to detect the language per clip
