{% extends "base.html" %}
{% block title %}{{ title }} · ClipVault{% endblock %}
{% block meta %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block mainclass %}gone{% endblock %}
{% block content %}
<section class="hero">
  <h1>{{ title }}</h1>
  <p class="lede">{{ text }}</p>
  {% if link %}<p><a class="pill primary big" href="{{ link }}">{{ link_text or 'Continue' }}</a></p>{% endif %}
</section>
{% endblock %}
